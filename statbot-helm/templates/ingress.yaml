apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: statbot-ui
  labels:
    name: statbot-ui
spec:
  rules:
  - host: {{ .Values.ingress.hostname | quote }}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: statbot-ui
            port: 
              number: {{ .Values.service.uiPort }}