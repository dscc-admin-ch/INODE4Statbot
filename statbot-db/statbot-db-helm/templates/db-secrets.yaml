apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: postgres
  # Replace with a secure default or use helm CLI flags to override
  password: "changeme-secure-postgres-password"

---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  access-key: "your-s3-access-key"
  secret-key: "your-s3-secret-key"